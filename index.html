<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/main.js" type="module"></script>
    <title>Travel Dashboard</title>
</head>
<body>
    <header>
        <h1>Travel Dashboard</h1>
        <nav>
            <span data-active="true">About</span>
            <span>Weather</span>
            <span>Currency</span>
        </nav>
    </header>


    <main>
        <section id="destination-select">
            <form id="destination-selection-form">
                <label for="destination-select">
                    <h2>Destination:</h2>
                </label>
                <select name=destination-select" id="destination-dropdown">
                </select>
            </form>
        </section>
        

        <section id="weather" class="content-card">
            <h2 id="selected-city-weather">Weather</h2>
            <p class="selected-temp"></p>
            <p id="rain-prob"></p>
        </section>
        

        <section id="currency-converter" class="content-card">
            <h2 id="selected-city-converter">Currency Converter</h2>
            <form id="currency-converter-form">
                <input id="converter-quantity" type="text" class="currency-input" name="currency-input" />
                <select name="currency-input" id="from-currency" class="currency-select">
                </select>
                <input id="converter-quantity-2" type="text" class="currency-input" name="currency-input-2" />
                <select name="to-currency" id="to-currency" class="currency-select">
                </select>
            </form>
        </section>


        <section id="destination-resume" class="content-card">
            <h2 id="selected-city">Details</h2>
            <section class="data-pills">
                <div class="data-pill" id="selected-country-data-pill">
                    <span class="selected-country"></span>
                    <span class="selected-country-id"></span>
                </div>
                <div class="data-pill" id="selected-temp">
                    <span class="selected-weather-icon"></span>
                    <span class="selected-temp-value"></span>
                </div>

            </section>
            <article id="city-description">
            </article>
        </section>


    </main>
</body>
</html>
