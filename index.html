<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/reset.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/main.js" type="module"></script>
    <title>Travel Dashboard</title>
</head>
<body>
    <header>
    </header>
    <main>
        <section id="destination-select">
            <form id="destination-selection-form">
                <label for="destination-select">
                    <h2>Destination:</h2>
                </label>
                <select name=destination-select" id="destination-dropdown">
                </select>
            </form>
        </section>
        
        <section id="weather" class="content-card" hidden>
            <h2 id="selected-city-weather">Weather</h2>
            <p class="selected-temp"></p>
            <p id="rain-prob"></p>
        </section>
        
        <section id="currency-converter" class="content-card" hidden>
            <h2 id="selected-city-converter">Currency Converter</h2>
            <form id="currency-converter-form">
                <label for="currency-input">
                    <p></p>
                </label>
                <input id="converter-quantity" type="text" class="currency-input" name="currency-input" />
                <select name="currency-input" id="from-currency">
                </select>
            </form>
        </section>
        <section id="destination-resume" class="content-card">
            <h2 id="selected-city">Details</h2>
            <div class="data-pill">
                <p class="selected-country"></p>
                <p class="selected-country-id"></p>
            </div>
            <p class="selected-temp"></p>
            <p class="selected-currency"></p>
        </section>

    </main>
</body>
</html>
